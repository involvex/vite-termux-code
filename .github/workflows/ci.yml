name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: typecheck, test, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check (src + server + scripts + tests)
        run: bun run check

      - name: Unit tests
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Build (UI + server bundle)
        run: bun run build

      # Boots the built app and drives it with headless Chrome over CDP: boots,
      # explorer, editor mount, breakpoint gutter, terminal PTY, extension
      # install + command palette, and asserts a clean console.
      - name: Smoke test (headless browser end-to-end)
        run: bun run smoke

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: td-code-dist
          path: dist
          retention-days: 7
          if-no-files-found: error